<html>
<head>
    <title>Cloudflare Nameserver Pair Lookup</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
:root {
    --bg: #ffffff;
    --surface: #fafafa;
    --border: #d0d7de;
    --text: #24292f;
    --muted: #656d76;
    --accent: #0969da;
    --accent-hover: #0550ae;
    --success: #1a7f37;
    --danger: #cf222e;

    --radius: 8px;
    --shadow: 0 1px 2px rgba(0,0,0,.05);
}

* {
    box-sizing: border-box;
}

html {
    font-size: 16px;
}

body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    line-height: 1.5;
}

.container {
    max-width: 760px;
    margin: 48px auto;
    padding: 0 20px;
}

h1 {
    margin: 0;
    font-size: 2rem;
    font-weight: 700;
}

#lastUpdated {
    margin: 8px 0 28px;
    color: var(--muted);
}

form {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    margin-bottom: 18px;
}

#query {
    flex: 1 1 320px;
    min-width: 220px;
}

input,
select,
button {
    font: inherit;
}

input[type="text"],
input:not([type]),
select {
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: white;
    color: var(--text);
    transition: .15s;
}

input[type="text"]:focus,
input:not([type]):focus,
select:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(9,105,218,.15);
}

input[type="submit"],
input[type="button"] {
    padding: 10px 18px;
    border: none;
    border-radius: var(--radius);
    cursor: pointer;
    transition: .15s;
}

input[type="submit"] {
    background: var(--accent);
    color: white;
}

input[type="submit"]:hover {
    background: var(--accent-hover);
}

#export {
    background: #f3f4f6;
    color: var(--text);
}

#export:hover {
    background: #e5e7eb;
}

input:disabled,
select:disabled {
    opacity: .6;
    cursor: not-allowed;
}

label {
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 6px;
}

#hideSpam {
    margin-left: 4px;
}

#count {
    display: block;
    margin: 20px 0 12px;
    color: var(--muted);
    font-size: .95rem;
}

table {
    width: 100%;
    border-collapse: collapse;
    background: white;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: var(--shadow);
    font-family:
        ui-monospace,
        SFMono-Regular,
        Menlo,
        Consolas,
        monospace;
}

td,
th {
    padding: 12px;
    border-bottom: 1px solid var(--border);
    text-align: left;
}

tr:last-child td {
    border-bottom: none;
}

tr:hover {
    background: #f6f8fa;
}

td:first-child {
    width: 100%;
    word-break: break-word;
}

td:last-child {
    white-space: nowrap;
}

a {
    color: var(--accent);
    text-decoration: none;
}

a:hover {
    text-decoration: underline;
}

button {
    border: 1px solid var(--border);
    background: white;
    border-radius: 6px;
    padding: 5px 8px;
    cursor: pointer;
    transition: .15s;
}

button:hover {
    background: #f6f8fa;
}

::-webkit-scrollbar {
    width: 10px;
    height: 10px;
}

::-webkit-scrollbar-thumb {
    background: #c8c8c8;
    border-radius: 999px;
}

::-webkit-scrollbar-thumb:hover {
    background: #a8a8a8;
}

@media (max-width: 700px) {

    .container {
        margin: 24px auto;
        padding: 16px;
    }

    h1 {
        font-size: 1.6rem;
    }

    form {
        flex-direction: column;
        align-items: stretch;
    }

    #query,
    select,
    input[type="submit"],
    input[type="button"] {
        width: 100%;
    }

    table {
        display: block;
        overflow-x: auto;
    }

    td:last-child {
        min-width: 150px;
    }
}
    </style>
</head>
<body>
    <div class="container">
        <h1>Cloudflare Nameserver Pair Lookup</h1>
        <p id="lastUpdated">Last updated: May 2026</p>
        <form>
            <input id="query" placeholder="ns pair or domain" required>
            <select id="backend">
                <option value="local">Local</option>
                <option value="whoisxmlapi">WhoisXMLAPI</option>
                <option value="dnslytics">DNSlytics</option>
            </select>
            <input type="submit" value="Search">
            <input id="export" type="button" value="Export">
            <br/>
            <label for="hideSpam">Hide probable spam</label>
            <input type="checkbox" name="hideSpam" id="hideSpam">
        </form>
        <span id="count"></span>
        <table id="domains"></table>
    </div>
    <script type="module">
        const dbUrl = location.hostname == 'localhost' ? 'db.bin' : 'https://media.githubusercontent.com/media/tmctmt/cloudflare-ns-pair-lookup/refs/heads/main/db.bin'
        const decoder = new TextDecoder('utf-8')

        function disableForm(disabled) {
            document.querySelectorAll('form, form input').forEach(el => el.disabled = disabled)
        }
        
        async function decompress(compressed) {
            const decompressed = await new Response(
                new Blob([compressed]).stream().pipeThrough(new DecompressionStream('gzip'))
            ).arrayBuffer()
            return decompressed
        }
        
        async function fetchDescriptors() {
            const resp = await fetch(dbUrl, {headers: {'Range': 'bytes=0-5000000'}, cache: 'force-cache'})
            const buffer = await resp.arrayBuffer()
            const headerSizeCompressed = new DataView(buffer).getUint32(0, true)
            const headerBuffer = await decompress(buffer.slice(4, 4 + headerSizeCompressed))
            const headerView = new DataView(headerBuffer)
            const descriptors = new Map()
            let headerCursor = 0
            let blockOffset = 4 + headerSizeCompressed
            while (headerCursor < headerBuffer.byteLength) {
                const keySize = headerView.getUint8(headerCursor)
                headerCursor += 1
                const key = decoder.decode(headerBuffer.slice(headerCursor, headerCursor + keySize))
                headerCursor += keySize
                const blockSize = headerView.getUint32(headerCursor, true)
                headerCursor += 4
                descriptors.set(key, [blockSize, blockOffset])
                blockOffset += blockSize
            }
            return descriptors
        }

        async function fetchBlock(size, offset) {
            const resp = await fetch(dbUrl, {headers: {'Range': `bytes=${offset}-${offset+size-1}`}})
            const data = await decompress(await resp.arrayBuffer())
            const domains = decoder.decode(data).split('\n')
            return domains
        }

        async function fetchDNS(domain) {
            const resp = await fetch(`https://cloudflare-dns.com/dns-query?name=${encodeURIComponent(domain)}&type=NS`, {headers: {'Accept': 'application/dns-json'}})
            const data = await resp.json()
            const nameservers = (data['Answer'] || []).map(x => x.data)
            return nameservers
        }

        async function fetchWhoisxmlapi(pair) {
            if (!localStorage.getItem('whoisxmlapi'))
                localStorage.setItem('whoisxmlapi', prompt('WhoisXMLAPI key'))
            const key = localStorage.getItem('whoisxmlapi')
            const resp = await fetch('https://reverse-whois.whoisxmlapi.com/api/v2', {
                method: 'POST',
                headers: {'content-type': 'application/json'},
                body: JSON.stringify({
                    'apiKey': key,
                    'searchType': 'historic',
                    'mode': 'purchase',
                    'advancedSearchTerms': pair.map(name => {
                        return {
                            'field': 'NameServers',
                            'term': `${name}.ns.cloudflare.com`
                        }
                    })
                })
            })
            if (resp.status === 403) {
                localStorage.removeItem('whoisxmlapi')
                return fetchWhoisxmlapi(pair)
            }
            const data = await resp.json()
            return data.domainsList
        }

        async function search(download) {
            let pair = document.querySelector('#query').value.trim().split(/[^a-zA-Z0-9-_.]+/)
            if (pair.length === 1)
                pair = await fetchDNS(pair[0])
            pair = pair.map(x => x.toLowerCase().split('.')[0]).sort()
            const key = pair.join(',')
            if (!descriptors.get(key))
                return alert('Website is not on Cloudflare or invalid pair')
            const backend = document.querySelector('#backend').value
            let domains
            try {
                disableForm(true)
                switch (backend) {
                    case 'local':
                        const [blockSize, blockOffset] = descriptors.get(key)
                        domains = await fetchBlock(blockSize, blockOffset)
                        break
                    case 'whoisxmlapi':
                        domains = await fetchWhoisxmlapi(pair)
                        break
                    case 'dnslytics':
                        const query = pair.map(x => `ns:${x}.ns.cloudflare.com`).join(' and ')
                        const url = `https://search.dnslytics.com/search?q=${encodeURIComponent(query)}&d=domains`
                        return window.open(url)
                }
            } finally {
                disableForm(false)
            }
            if (document.querySelector('#hideSpam').checked)
                domains = domains.filter(domain => !domain.includes('xn--') && !domain.match(/\.(ru|tk|gq|ml|cf|cc|sbs|top|pro|tech|info|vip|site|xyz|click|online|cyou|biz|shop|workers\.dev|pages\.dev)$/))
            document.querySelector('#count').textContent = `${domains.length} results`
            if (download) {
                const blob = new Blob([domains.join('\n')], { type: 'text/plain' })
                const link = document.createElement('a')
                link.href = URL.createObjectURL(blob)
                link.download = 'domains.txt'
                link.click()
            } else {
                const table = document.getElementById('domains')
                table.querySelectorAll('tr').forEach(e => e.remove())
                for (const domain of domains) {
                    const row = table.insertRow()
                    row.insertCell().textContent = domain
                    row.insertCell().innerHTML = `
                        <a title="Link" href="https://${domain}/" target="_blank"><button>&#128279;</button></a>
                        <a title="Archive" href="https://web.archive.org/web/*/${domain}/*" target="_blank"><button>&#x1F3DB;&#xFE0F;</button></a>
                        <a title="WHOIS" href="https://www.whoxy.com/${domain}" target="_blank"><button>&#x1F310;</button></a>
                        <a title="DNS" href="https://dnshistory.org/dns-records/${domain}" target="_blank"><button>&#x1F5A7;</button></a>
                    `
                }
            }
        }

        disableForm(true)
        const descriptors = await fetchDescriptors()
        disableForm(false)
        document.querySelector('#query').focus()
        document.querySelector('form').onsubmit = (e) => { e.preventDefault(); search() }
        document.querySelector('#export').onclick = () => search(true)

    </script>
</body>
</html>
