<html>
<head>
    <title>Cloudflare Nameserver Pair Lookup</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        a {
            color: black;
            text-decoration: none;
        }

        /* w3schools ahh point and laugh */
        td, th {
            border: 1px solid #dddddd;
            text-align: left;
            padding: 8px;
            font-family: monospace;
            font-size: 16px;
        }

        tr:nth-child(even) {
            background-color: #dddddd;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Cloudflare Nameserver Pair Lookup</h1>
        <p id="lastUpdated">Last updated: May 2026</p>

        <form>
            <input id="query" placeholder="ns pair or domain" required>
            <select id="backend">
                <option value="local">Local (Historic)</option>
                <option value="whoisxmlapi">WhoisXMLAPI (Historic)</option>
                <option value="dnslytics">DNSLytics (Current)</option>
            </select>
            <input type="submit" value="Search">
            <input id="export" type="button" value="Export">
            <label for="hideSpam">Hide probable spam</label>
            <input type="checkbox" name="hideSpam" id="hideSpam">
        </form>

        <p id="count"></p>

        <table id="domains">
            <tr>
                <th>Domain</th>
                <th>Actions</th>
            </tr>
        </table>
    </div>

    <script type="module">
        const dbUrl = location.hostname == 'localhost' ? 'db.bin' : 'https://media.githubusercontent.com/media/tmctmt/cloudflare-ns-pair-lookup/refs/heads/main/db.bin'
        const decoder = new TextDecoder('utf-8')

        function disableForm(disabled) {
            document.querySelectorAll('form, form input').forEach(el => el.disabled = disabled)
        }
        
        async function decompress(compressed) {
            const decompressed = await new Response(
                new Blob([compressed]).stream().pipeThrough(new DecompressionStream('gzip'))
            ).arrayBuffer()
            return decompressed
        }
        
        async function fetchDescriptors() {
            const resp = await fetch(dbUrl, {headers: {'Range': 'bytes=0-5000000'}, cache: 'force-cache'})
            const buffer = await resp.arrayBuffer()
            const headerSizeCompressed = new DataView(buffer).getUint32(0, true)
            const headerBuffer = await decompress(buffer.slice(4, 4 + headerSizeCompressed))
            const headerView = new DataView(headerBuffer)
            const descriptors = new Map()
            let headerCursor = 0
            let blockOffset = 4 + headerSizeCompressed
            while (headerCursor < headerBuffer.byteLength) {
                const keySize = headerView.getUint8(headerCursor)
                headerCursor += 1
                const key = decoder.decode(headerBuffer.slice(headerCursor, headerCursor + keySize))
                headerCursor += keySize
                const blockSize = headerView.getUint32(headerCursor, true)
                headerCursor += 4
                descriptors.set(key, [blockSize, blockOffset])
                blockOffset += blockSize
            }
            return descriptors
        }

        async function fetchBlock(size, offset) {
            const resp = await fetch(dbUrl, {headers: {'Range': `bytes=${offset}-${offset+size-1}`}})
            const data = await decompress(await resp.arrayBuffer())
            const domains = decoder.decode(data).split('\n')
            return domains
        }

        async function fetchDNS(domain) {
            const resp = await fetch(`https://cloudflare-dns.com/dns-query?name=${encodeURIComponent(domain)}&type=NS`, {headers: {'Accept': 'application/dns-json'}})
            const data = await resp.json()
            const nameservers = (data['Answer'] || []).map(x => x.data)
            return nameservers
        }

        async function fetchWhoisxmlapi(pair) {
            if (!localStorage.getItem('whoisxmlapi'))
                localStorage.setItem('whoisxmlapi', prompt('WhoisXMLAPI key'))
            const key = localStorage.getItem('whoisxmlapi')
            const resp = await fetch('https://reverse-whois.whoisxmlapi.com/api/v2', {
                method: 'POST',
                headers: {'content-type': 'application/json'},
                body: JSON.stringify({
                    'apiKey': key,
                    'searchType': 'historic',
                    'mode': 'purchase',
                    'advancedSearchTerms': pair.map(name => {
                        return {
                            'field': 'NameServers',
                            'term': `${name}.ns.cloudflare.com`
                        }
                    })
                })
            })
            if (resp.status === 403) {
                localStorage.removeItem('whoisxmlapi')
                return fetchWhoisxmlapi(pair)
            }
            const data = await resp.json()
            return data.domainsList
        }

        async function search(download) {
            let pair = document.querySelector('#query').value.trim().split(/[^a-zA-Z0-9-_.]+/)
            if (pair.length === 1)
                pair = await fetchDNS(pair[0])
            pair = pair.map(x => x.toLowerCase().split('.')[0]).sort()
            const key = pair.join(',')
            if (!descriptors.get(key))
                return alert('Website is not on Cloudflare or invalid pair')
            const backend = document.querySelector('#backend').value
            let domains
            try {
                disableForm(true)
                switch (backend) {
                    case 'local':
                        const [blockSize, blockOffset] = descriptors.get(key)
                        domains = await fetchBlock(blockSize, blockOffset)
                        break
                    case 'whoisxmlapi':
                        domains = await fetchWhoisxmlapi(pair)
                        break
                    case 'dnslytics':
                        const query = pair.map(x => `ns:${x}.ns.cloudflare.com`).join(' and ')
                        const url = `https://search.dnslytics.com/search?q=${encodeURIComponent(query)}&d=domains`
                        return window.open(url)
                }
            } finally {
                disableForm(false)
            }
            if (document.querySelector('#hideSpam').checked)
                domains = domains.filter(domain => !domain.includes('xn--') && !domain.match(/\.(ru|tk|gq|ml|cf|sbs|top|pro|tech|info|vip|site|xyz|click|online|workers\.dev|pages\.dev)$/))
            document.querySelector('#count').textContent = `${domains.length} results`
            if (download) {
                const blob = new Blob([domains.join('\n')], { type: 'text/plain' })
                const link = document.createElement('a')
                link.href = URL.createObjectURL(blob)
                link.download = 'domains.txt'
                link.click()
            } else {
                const table = document.getElementById('domains')
                table.querySelectorAll('.row').forEach(e => e.remove())
                for (const domain of domains) {
                    const row = table.insertRow()
                    row.className = 'row'
                    row.insertCell(0).textContent = domain
                    row.insertCell(1).innerHTML = `
                        <button title="Link" onclick="window.open('https://${domain}/', '_blank');return false">&#128279;</button>
                        <button title="Archive" onclick="window.open('https://web.archive.org/web/*/${domain}/*', '_blank');return false">&#x1F3DB;&#xFE0F;</button>
                        <button title="WHOIS" onclick="window.open('https://www.whoxy.com/${domain}', '_blank');return false">&#x1F310;</button>
                        <button title="DNS" onclick="window.open('https://dnshistory.org/dns-records/${domain}', '_blank');return false">&#x1F5A7;</button>
                    `
                }
            }
        }

        disableForm(true)
        const descriptors = await fetchDescriptors()
        disableForm(false)
        document.querySelector('#query').focus()
        document.querySelector('form').addEventListener('submit', (e) => { e.preventDefault(); search() })
        document.querySelector('#export').addEventListener('click', (e) => search(true))

    </script>
</body>
</html>
